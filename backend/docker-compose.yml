services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gadgethub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - gadgethub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gadgethub"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  gadgethub_pgdata:
